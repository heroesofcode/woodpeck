[package]
name = "woodpeck"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
description = "A local Woodpecker Method chess puzzle trainer"
license = "GPL-3.0-or-later"
repository = "https://github.com/heroesofcode/woodpeck"
readme = "README.md"
keywords = ["chess", "puzzles", "woodpecker", "training", "egui"]
categories = ["games"]

[features]
default = ["sound"]
sound = ["dep:rodio"]

[dependencies]
rodio = { version = "0.23", default-features = false, features = ["playback"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
shakmaty = "0.30.2"
pgn-reader = "0.29.1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
directories = "6"
ureq = { version = "3", default-features = false, features = ["rustls"] }
csv = "1"
zstd = "0.13"

resvg = { version = "0.47", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "training"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Public domain methods document their contract in prose rather than repetitive sections.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Qualified module paths already convey the context of these domain types.
module_name_repetitions = "allow"
# Constructors and pure calculation methods are intentionally usable without attributes.
must_use_candidate = "allow"
# Millisecond totals are well below f64 integer precision in realistic training histories.
cast_precision_loss = "allow"
# Settings switches and timer pause gates are independent booleans, not mutually exclusive states.
struct_excessive_bools = "allow"

[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Keep benchmark code generation identical across before/after captures.
[profile.bench]
lto = false
codegen-units = 16
