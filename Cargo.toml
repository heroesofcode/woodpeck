[package]
name = "woodpeck"
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
description = "A local Woodpecker Method chess puzzle trainer"
license = "GPL-3.0-or-later"
repository = "https://github.com/heroesofcode/woodpeck"
readme = "README.md"
keywords = ["chess", "puzzles", "woodpecker", "training", "egui"]
categories = ["games"]

[features]
default = ["sound"]
sound = ["dep:rodio"]

[dependencies]
# Same types as std::time on native targets; browser-backed on wasm32.
web-time = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
shakmaty = "0.30.2"
pgn-reader = "0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
csv = "1"

resvg = { version = "0.47", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
scraper = { version = "0.29.0", default-features = false }
sha2 = "0.10.9"
pdf-extract = "0.12.1"
lopdf = { version = "0.42", default-features = false }
hayro-jbig2 = { version = "0.3", default-features = false }

# Desktop-only: native C libraries, processes, audio devices, and the filesystem.
# Gated by target so the default desktop build resolves exactly as before.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "0.23", default-features = false, features = ["playback"], optional = true }
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zstd = "0.14.3"
# System file chooser: XDG portal over libdbus loaded at runtime (zenity fallback), native on macOS/Windows.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
pollster = "0.4"

# Browser clock for chrono::Utc::now on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
# The same SQLite schema and queries in the browser, compiled to wasm by sqlite-wasm-rs.
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
# Pure-Rust zstd decoder for the bundled starter puzzles.
ruzstd = "0.8"
# Browser shell: async fetch, timers, IndexedDB persistence, and the egui web runner glue.
ehttp = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Navigator", "StorageManager", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Element", "console", "Storage", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "IdbVersionChangeEvent", "Event", "EventTarget", "DomException", "VisibilityState"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "training"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Public domain methods document their contract in prose rather than repetitive sections.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Qualified module paths already convey the context of these domain types.
module_name_repetitions = "allow"
# Constructors and pure calculation methods are intentionally usable without attributes.
must_use_candidate = "allow"
# Millisecond totals are well below f64 integer precision in realistic training histories.
cast_precision_loss = "allow"
# Settings switches and timer pause gates are independent booleans, not mutually exclusive states.
struct_excessive_bools = "allow"

[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Keep benchmark code generation identical across before/after captures.
[profile.bench]
lto = false
codegen-units = 16
