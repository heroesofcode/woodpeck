[advisories]
yanked = "deny"
# lopdf 0.42 fixes the nested-object stack overflow. Its font metrics dependency has
# no replacement release yet; this advisory reports maintenance status, not a vulnerability.
ignore = [{ id = "RUSTSEC-2026-0192", reason = "lopdf 0.42 requires ttf-parser 0.25 for PDF font metrics; revisit when upstream migrates" }]

[licenses]
allow = [
    "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "MPL-2.0", "OFL-1.1", "GPL-3.0-or-later",
    "Ubuntu-font-1.0",
    # Mozilla's root certificate data, bundled by webpki-roots for rustls.
    "CDLA-Permissive-2.0",
]

[bans]
# Native window/audio backends currently require multiple platform crate versions.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
