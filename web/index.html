<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Woodpeck</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1b1b; }
    canvas#woodpeck { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ddd; font: 16px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="woodpeck"></canvas>
  <div id="loading">Loading Woodpeck…</div>
  <script type="module">
    import init from "./woodpeck.js";
    init().catch((error) => {
      document.getElementById("loading").textContent = "Woodpeck could not start: " + error;
    });
  </script>
</body>
</html>
